{% extends "base.html" %}
{% block title %}Компания — JobPlatform{% endblock %}

{% block content %}
<div id="company-page" class="max-w-5xl mx-auto space-y-6">
    <div class="flex justify-center py-12">
        <div class="w-8 h-8 border-3 border-primary-200 border-t-primary-600 rounded-full animate-spin"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const params = new URLSearchParams(window.location.search);
    const companyName = params.get('name') || '';

    if (!companyName) {
        document.getElementById('company-page').innerHTML = '<p class="text-center text-gray-500 py-12">Компания не указана</p>';
    } else {
        loadCompany();
    }

    async function loadCompany() {
        try {
            const info = await api(`/jobs/company-info/?name=${encodeURIComponent(companyName)}`);
            const jobsData = await api(`/jobs/?company=${encodeURIComponent(companyName)}`);
            const jobs = jobsData.results || [];

            const profile = getProfile();
            const isOwner = profile && info.hr_id === profile.user?.id;

            const page = document.getElementById('company-page');
            page.innerHTML = `
                <a href="/jobs/" class="inline-flex items-center gap-1 text-sm text-gray-500 hover:text-primary-600 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    Все вакансии
                </a>

                <!-- Company Header -->
                <div class="card p-6 slide-up">
                    <div class="flex items-start gap-5">
                        <div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-primary-100 to-primary-200 flex items-center justify-center text-2xl font-bold text-primary-700 shrink-0">
                            ${info.name[0].toUpperCase()}
                        </div>
                        <div class="flex-1">
                            <div class="flex items-center gap-3 mb-2">
                                <h1 class="text-2xl font-bold text-gray-900">${info.name}</h1>
                                <span class="text-xs px-2.5 py-1 rounded-lg bg-primary-50 text-primary-700 ring-1 ring-primary-200 font-medium">
                                    ${info.jobs_count} ${info.jobs_count === 1 ? 'вакансия' : info.jobs_count < 5 ? 'вакансии' : 'вакансий'}
                                </span>
                            </div>
                            ${info.description ? `
                                <p class="text-gray-600 leading-relaxed">${info.description}</p>
                            ` : '<p class="text-gray-400 italic">Описание компании не указано</p>'}
                            ${info.hr_username ? `
                                <div class="flex items-center gap-2 mt-3 text-sm text-gray-500">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                                    HR: ${info.hr_username}
                                </div>
                            ` : ''}
                            ${isOwner ? `
                                <button onclick="toggleEditCompany()" class="inline-flex items-center gap-1 mt-3 text-sm text-primary-600 hover:text-primary-700 font-medium">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                                    Редактировать
                                </button>
                            ` : ''}
                        </div>
                    </div>
                </div>

                <!-- Jobs List -->
                <div class="space-y-3">
                    <h2 class="text-lg font-semibold flex items-center gap-2">
                        <svg class="w-5 h-5 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                        Вакансии компании
                    </h2>
                    ${jobs.length === 0 ? '<p class="text-gray-400 text-center py-8">Нет активных вакансий</p>' :
                        jobs.map(job => `
                            <a href="/jobs/${job.id}/" class="card p-5 block hover:shadow-md transition-all slide-up">
                                <div class="flex justify-between items-start gap-4">
                                    <div class="flex-1 min-w-0">
                                        <div class="flex items-center gap-2 mb-2 flex-wrap">
                                            <span class="font-semibold text-gray-900 text-lg">${job.title}</span>
                                            ${levelBadge(job.level)}
                                            ${job.is_remote ? '<span class="text-xs px-2 py-0.5 rounded-lg bg-primary-50 text-primary-700 font-medium">Remote</span>' : ''}
                                        </div>
                                        <div class="flex items-center gap-3 text-sm text-gray-500 mb-2">
                                            <span>${job.location}</span>
                                            <span>${job.experience_years} лет опыта</span>
                                        </div>
                                        <div class="flex flex-wrap gap-1.5">
                                            ${(job.tech_stack || []).slice(0, 5).map(t => `<span class="text-xs px-2 py-0.5 bg-gray-100 text-gray-600 rounded-lg">${t}</span>`).join('')}
                                            ${(job.tech_stack || []).length > 5 ? `<span class="text-xs text-gray-400">+${job.tech_stack.length - 5}</span>` : ''}
                                        </div>
                                    </div>
                                    <div class="text-right shrink-0">
                                        <div class="font-bold text-gray-900">${formatSalary(job.salary_min, job.salary_max)}</div>
                                        <div class="text-xs text-gray-400 mt-1">${timeAgo(job.created_at)}</div>
                                    </div>
                                </div>
                            </a>
                        `).join('')}
                </div>

                ${isOwner ? `
                <!-- Edit Company Form (hidden) -->
                <div id="edit-company-form" class="card p-6 slide-up hidden">
                    <h2 class="text-lg font-semibold mb-4">Редактировать информацию о компании</h2>
                    <form onsubmit="saveCompanyInfo(event)" class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Название компании</label>
                            <input type="text" id="edit-company-name" value="${info.name}" class="input-field" required>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1.5">Описание компании</label>
                            <textarea id="edit-company-desc" rows="4" class="input-field" placeholder="Расскажите о компании, её миссии, культуре...">${info.description || ''}</textarea>
                        </div>
                        <div class="flex gap-3">
                            <button type="button" onclick="toggleEditCompany()" class="btn-secondary">Отмена</button>
                            <button type="submit" class="btn-primary">Сохранить</button>
                        </div>
                    </form>
                </div>
                ` : ''}
            `;
        } catch(e) {
            document.getElementById('company-page').innerHTML = '<p class="text-danger-500 text-center py-12">Ошибка загрузки</p>';
        }
    }

    function toggleEditCompany() {
        const form = document.getElementById('edit-company-form');
        if (form) form.classList.toggle('hidden');
    }

    async function saveCompanyInfo(e) {
        e.preventDefault();
        try {
            await api('/accounts/profiles/me/', {
                method: 'PATCH',
                body: {
                    company_name: document.getElementById('edit-company-name').value,
                    company_description: document.getElementById('edit-company-desc').value,
                },
            });
            toast('Информация о компании обновлена!');
            loadCompany();
        } catch(err) {
            toast('Ошибка сохранения', 'error');
        }
    }
</script>
{% endblock %}
