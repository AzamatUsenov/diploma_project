{% extends "base.html" %}
{% block title %}Профиль — JobPlatform{% endblock %}

{% block content %}
<div id="profile-page" class="max-w-2xl mx-auto space-y-6">
    <p class="text-gray-500">Загрузка...</p>
</div>
{% endblock %}

{% block extra_js %}
<script>
    if (!isLoggedIn()) { window.location = '/login/'; }

    async function loadProfile() {
        try {
            const profile = await api('/accounts/profiles/me/');
            localStorage.setItem('profile', JSON.stringify(profile));
            updateNav();

            const isHR = profile.role === 'hr';
            const page = document.getElementById('profile-page');

            page.innerHTML = `
                <h1 class="text-2xl font-bold">Профиль</h1>

                <div class="bg-white rounded-xl border shadow-sm p-6">
                    <div class="flex items-center gap-4 mb-6">
                        <div class="w-16 h-16 rounded-full bg-primary-100 flex items-center justify-center text-2xl font-bold text-primary-600">
                            ${profile.user.username[0].toUpperCase()}
                        </div>
                        <div>
                            <div class="text-lg font-semibold">${profile.user.username}</div>
                            <div class="text-sm text-gray-500">${profile.user.email}</div>
                            <div class="flex gap-2 mt-1">
                                <span class="text-xs px-2 py-0.5 rounded-full ${isHR ? 'bg-orange-100 text-orange-700' : 'bg-green-100 text-green-700'}">
                                    ${isHR ? 'HR' : 'Соискатель'}
                                </span>
                                ${!isHR ? levelBadge(profile.level) : ''}
                            </div>
                        </div>
                    </div>

                    <form id="profile-form" onsubmit="saveProfile(event)" class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Имя</label>
                                <input type="text" name="first_name" value="${profile.user.first_name || ''}" class="w-full border rounded-lg px-3 py-2 text-sm">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Фамилия</label>
                                <input type="text" name="last_name" value="${profile.user.last_name || ''}" class="w-full border rounded-lg px-3 py-2 text-sm">
                            </div>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">О себе</label>
                            <textarea name="bio" rows="3" class="w-full border rounded-lg px-3 py-2 text-sm">${profile.bio || ''}</textarea>
                        </div>

                        ${!isHR ? `
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Навыки (через запятую)</label>
                            <input type="text" name="skills" value="${(profile.skills || []).join(', ')}" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Python, Django, JavaScript">
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">Portfolio URL</label>
                                <input type="url" name="portfolio_url" value="${profile.portfolio_url || ''}" class="w-full border rounded-lg px-3 py-2 text-sm">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">GitHub URL</label>
                                <input type="url" name="github_url" value="${profile.github_url || ''}" class="w-full border rounded-lg px-3 py-2 text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Уровень</label>
                            <select name="level" class="w-full border rounded-lg px-3 py-2 text-sm">
                                <option value="junior" ${profile.level === 'junior' ? 'selected' : ''}>Junior</option>
                                <option value="mid" ${profile.level === 'mid' ? 'selected' : ''}>Mid</option>
                                <option value="senior" ${profile.level === 'senior' ? 'selected' : ''}>Senior</option>
                            </select>
                        </div>
                        ` : `
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Компания</label>
                            <input type="text" name="company_name" value="${profile.company_name || ''}" class="w-full border rounded-lg px-3 py-2 text-sm">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">О компании</label>
                            <textarea name="company_description" rows="3" class="w-full border rounded-lg px-3 py-2 text-sm">${profile.company_description || ''}</textarea>
                        </div>
                        `}

                        <button type="submit" class="bg-primary-600 text-white px-6 py-2 rounded-lg text-sm hover:bg-primary-700">Сохранить</button>
                    </form>
                </div>

                <!-- Test results -->
                ${!isHR ? '<div id="test-results"></div>' : ''}
            `;

            if (!isHR) loadTestResults();
        } catch(e) {
            document.getElementById('profile-page').innerHTML = '<p class="text-red-500">Ошибка загрузки профиля</p>';
        }
    }

    async function saveProfile(e) {
        e.preventDefault();
        const form = e.target;
        const data = { bio: form.bio.value };

        const profile = getProfile();
        if (profile.role !== 'hr') {
            data.skills = form.skills.value.split(',').map(s => s.trim()).filter(Boolean);
            data.portfolio_url = form.portfolio_url.value;
            data.github_url = form.github_url.value;
            data.level = form.level.value;
        } else {
            data.company_name = form.company_name.value;
            data.company_description = form.company_description.value;
        }

        try {
            await api('/accounts/profiles/me/', { method: 'PATCH', body: data });
            toast('Профиль сохранён!');
            loadProfile();
        } catch(e) {
            toast('Ошибка сохранения', 'error');
        }
    }

    async function loadTestResults() {
        try {
            const data = await api('/tests/results/');
            const container = document.getElementById('test-results');
            if (!data.results || data.results.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-xl border shadow-sm p-6">
                        <h2 class="font-semibold text-lg mb-2">Результаты тестов</h2>
                        <p class="text-sm text-gray-500">Вы ещё не проходили тестов. <a href="/tests/" class="text-primary-600 hover:underline">Пройти тест</a></p>
                    </div>`;
                return;
            }
            container.innerHTML = `
                <div class="bg-white rounded-xl border shadow-sm p-6">
                    <h2 class="font-semibold text-lg mb-4">Результаты тестов</h2>
                    <div class="space-y-3">
                        ${data.results.map(r => {
                            const pct = r.max_score > 0 ? Math.round((r.score / r.max_score) * 100) : 0;
                            const passed = r.status === 'passed';
                            return `
                            <div class="flex items-center justify-between p-3 rounded-lg bg-gray-50">
                                <div>
                                    <div class="font-medium text-sm">${r.test_title || 'Тест #' + r.test}</div>
                                    <div class="text-xs text-gray-500">${new Date(r.completed_at).toLocaleDateString('ru')}</div>
                                </div>
                                <div class="flex items-center gap-3">
                                    <span class="text-sm font-bold ${passed ? 'text-green-600' : 'text-red-600'}">${r.score}/${r.max_score} (${pct}%)</span>
                                    <span class="text-xs px-2 py-0.5 rounded-full ${passed ? 'bg-green-100 text-green-700' : 'bg-red-100 text-red-700'}">${passed ? 'Сдан' : 'Не сдан'}</span>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
        } catch(e) {}
    }

    loadProfile();
</script>
{% endblock %}
