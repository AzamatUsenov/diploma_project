{% extends "base.html" %}
{% block title %}Вход — JobPlatform{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12 fade-in">
    <div class="text-center mb-8">
        <div class="w-16 h-16 rounded-2xl bg-primary-100 flex items-center justify-center mx-auto mb-4">
            <svg class="w-8 h-8 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/></svg>
        </div>
        <h1 class="text-3xl font-bold text-gray-900">С возвращением!</h1>
        <p class="text-gray-500 mt-2">Войдите в аккаунт JobPlatform</p>
    </div>

    <div class="card p-8">
        <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Имя пользователя</label>
                <div class="relative">
                    <div class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>
                    </div>
                    <input type="text" name="username" required class="input-field !pl-10" placeholder="username" autofocus>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">Пароль</label>
                <div class="relative">
                    <div class="absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    </div>
                    <input type="password" name="password" required class="input-field !pl-10 !pr-10" placeholder="Пароль" id="login-password">
                    <button type="button" onclick="togglePass()" class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                        <svg class="w-5 h-5" id="eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/></svg>
                    </button>
                </div>
            </div>
            <div id="login-error" class="hidden text-sm text-danger-700 bg-danger-50 p-4 rounded-xl border border-danger-100"></div>
            <button type="submit" id="login-btn" class="w-full btn-primary !py-3 text-base">Войти</button>
        </form>

        <div class="mt-6 pt-6 border-t text-center">
            <p class="text-sm text-gray-500">
                Нет аккаунта? <a href="/register/" class="text-primary-600 font-medium hover:underline">Зарегистрироваться</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    if (isLoggedIn()) window.location = '/';

    function togglePass() {
        const inp = document.getElementById('login-password');
        inp.type = inp.type === 'password' ? 'text' : 'password';
    }

    async function handleLogin(e) {
        e.preventDefault();
        const form = e.target;
        const errEl = document.getElementById('login-error');
        errEl.classList.add('hidden');

        const btn = document.getElementById('login-btn');
        btn.disabled = true;
        btn.textContent = 'Входим...';

        try {
            const result = await api('/accounts/login/', {
                method: 'POST',
                body: { username: form.username.value, password: form.password.value },
            });
            saveAuth(result);
            toast('Добро пожаловать!');
            const redirect = new URLSearchParams(window.location.search).get('next') || '/';
            window.location = redirect;
        } catch (err) {
            errEl.textContent = err.detail || 'Неверные данные для входа';
            errEl.classList.remove('hidden');
            btn.disabled = false;
            btn.textContent = 'Войти';
        }
    }
</script>
{% endblock %}
