{% extends "base.html" %}
{% block title %}Вход — JobPlatform{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
    <div class="bg-white rounded-xl border shadow-sm p-8">
        <h1 class="text-2xl font-bold text-center mb-6">Вход</h1>
        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Имя пользователя</label>
                <input type="text" name="username" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
                <input type="password" name="password" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
            </div>
            <div id="login-error" class="hidden mb-4 text-sm text-red-600 bg-red-50 p-3 rounded-lg"></div>
            <button type="submit" class="w-full bg-primary-600 text-white py-2.5 rounded-lg font-medium hover:bg-primary-700 transition">Войти</button>
        </form>
        <p class="text-center text-sm text-gray-500 mt-4">
            Нет аккаунта? <a href="/register/" class="text-primary-600 hover:underline">Зарегистрироваться</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    if (isLoggedIn()) window.location = '/';

    async function handleLogin(e) {
        e.preventDefault();
        const form = e.target;
        const errEl = document.getElementById('login-error');
        errEl.classList.add('hidden');

        const data = {
            username: form.username.value,
            password: form.password.value,
        };

        try {
            const result = await api('/accounts/login/', { method: 'POST', body: data });
            saveAuth(result);
            toast('Добро пожаловать!');
            window.location = '/';
        } catch (err) {
            errEl.textContent = err.detail || 'Неверные данные';
            errEl.classList.remove('hidden');
        }
    }
</script>
{% endblock %}
