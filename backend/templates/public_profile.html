{% extends "base.html" %}
{% block title %}Профиль пользователя — JobPlatform{% endblock %}

{% block content %}
<div id="public-profile" class="max-w-2xl mx-auto space-y-6">
    <div class="flex justify-center py-12">
        <div class="w-8 h-8 border-3 border-primary-200 border-t-primary-600 rounded-full animate-spin"></div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const profileId = window.location.pathname.split('/').filter(Boolean).pop();

    async function loadPublicProfile() {
        try {
            const profile = await api(`/accounts/profiles/${profileId}/`);
            const isHR = profile.role === 'hr';
            const page = document.getElementById('public-profile');

            page.innerHTML = `
                <a href="javascript:history.back()" class="inline-flex items-center gap-1 text-sm text-gray-500 hover:text-primary-600 transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    Назад
                </a>

                <div class="card p-6 slide-up">
                    <div class="flex items-center gap-5">
                        <div class="w-20 h-20 rounded-2xl bg-gradient-to-br from-primary-400 to-purple-500 flex items-center justify-center text-3xl font-bold text-white shadow-lg">
                            ${profile.user.username[0].toUpperCase()}
                        </div>
                        <div>
                            <h1 class="text-2xl font-bold text-gray-900 mb-1">
                                ${profile.user.first_name || profile.user.last_name
                                    ? `${profile.user.first_name || ''} ${profile.user.last_name || ''}`
                                    : profile.user.username}
                            </h1>
                            <div class="text-sm text-gray-500 mb-2">@${profile.user.username}</div>
                            <div class="flex gap-2">
                                <span class="text-xs px-2.5 py-1 rounded-lg font-medium ${isHR ? 'bg-warning-50 text-warning-700 ring-1 ring-warning-200' : 'bg-success-50 text-success-700 ring-1 ring-success-200'}">
                                    ${isHR ? 'HR менеджер' : 'Соискатель'}
                                </span>
                                ${!isHR && profile.level ? levelBadge(profile.level) : ''}
                            </div>
                        </div>
                    </div>
                </div>

                ${profile.bio ? `
                <div class="card p-6 slide-up" style="animation-delay:0.1s">
                    <h2 class="text-sm font-semibold text-gray-500 mb-2">О себе</h2>
                    <p class="text-gray-700">${profile.bio}</p>
                </div>` : ''}

                ${!isHR && profile.skills && profile.skills.length ? `
                <div class="card p-6 slide-up" style="animation-delay:0.15s">
                    <h2 class="text-sm font-semibold text-gray-500 mb-3">Навыки</h2>
                    <div class="flex flex-wrap gap-2">
                        ${profile.skills.map(s => {
                            const verified = (profile.verified_skills || []).includes(s);
                            return verified
                                ? `<span class="text-sm px-3 py-1.5 bg-green-50 text-green-700 rounded-lg font-medium ring-1 ring-green-200 flex items-center gap-1.5">
                                    <svg class="w-3.5 h-3.5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                                    ${s}</span>`
                                : `<span class="text-sm px-3 py-1.5 bg-gray-50 text-gray-600 rounded-lg font-medium ring-1 ring-gray-200">${s}</span>`;
                        }).join('')}
                    </div>
                    <p class="text-xs text-gray-400 mt-3 flex items-center gap-1.5">
                        <svg class="w-3.5 h-3.5 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                        Подтверждённые навыки (тестом) имеют больший вес при матчинге
                    </p>
                </div>` : ''}

                ${isHR && profile.company_name ? `
                <div class="card p-6 slide-up" style="animation-delay:0.15s">
                    <h2 class="text-sm font-semibold text-gray-500 mb-2">Компания</h2>
                    <div class="text-lg font-semibold text-gray-900 mb-1">${profile.company_name}</div>
                    ${profile.company_description ? `<p class="text-gray-600 text-sm">${profile.company_description}</p>` : ''}
                </div>` : ''}

                <div class="flex gap-3 slide-up" style="animation-delay:0.2s">
                    ${profile.portfolio_url ? `<a href="${profile.portfolio_url}" target="_blank" class="btn-secondary flex items-center gap-2">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                        Портфолио
                    </a>` : ''}
                    ${profile.github_url ? `<a href="${profile.github_url}" target="_blank" class="btn-secondary flex items-center gap-2">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg>
                        GitHub
                    </a>` : ''}
                </div>
            `;
        } catch(e) {
            document.getElementById('public-profile').innerHTML = '<p class="text-danger-500 text-center py-12">Профиль не найден</p>';
        }
    }

    loadPublicProfile();
</script>
{% endblock %}
