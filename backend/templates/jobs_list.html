{% extends "base.html" %}
{% block title %}Вакансии — JobPlatform{% endblock %}

{% block content %}
<!-- Filters -->
<div class="bg-white rounded-xl shadow-sm border p-4 mb-6">
    <div class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
        <input id="f-search" type="text" placeholder="Поиск..." class="border rounded-lg px-3 py-2 text-sm col-span-2" oninput="debounceLoad()">
        <select id="f-level" class="border rounded-lg px-3 py-2 text-sm" onchange="loadJobs()">
            <option value="">Все уровни</option>
            <option value="junior">Junior</option>
            <option value="mid">Mid</option>
            <option value="senior">Senior</option>
        </select>
        <select id="f-remote" class="border rounded-lg px-3 py-2 text-sm" onchange="loadJobs()">
            <option value="">Формат</option>
            <option value="true">Удалённо</option>
            <option value="false">Офис</option>
        </select>
        <select id="f-training" class="border rounded-lg px-3 py-2 text-sm" onchange="loadJobs()">
            <option value="">Обучение</option>
            <option value="true">С обучением</option>
        </select>
        <select id="f-ordering" class="border rounded-lg px-3 py-2 text-sm" onchange="loadJobs()">
            <option value="-created_at">Новые</option>
            <option value="-salary_max">Зарплата &darr;</option>
            <option value="salary_min">Зарплата &uarr;</option>
            <option value="-honesty_score">Честность &darr;</option>
            <option value="experience_years">Опыт &uarr;</option>
        </select>
    </div>
    <div class="flex gap-3 mt-3">
        <input id="f-salary-min" type="number" placeholder="ЗП от (₸)" class="border rounded-lg px-3 py-2 text-sm w-32" onchange="loadJobs()">
        <input id="f-salary-max" type="number" placeholder="ЗП до (₸)" class="border rounded-lg px-3 py-2 text-sm w-32" onchange="loadJobs()">
        <input id="f-honesty" type="number" placeholder="Честность от %" class="border rounded-lg px-3 py-2 text-sm w-36" onchange="loadJobs()">
        <button onclick="resetFilters()" class="text-sm text-gray-500 hover:text-red-500 ml-auto">Сбросить</button>
    </div>
</div>

<!-- Results count -->
<div class="flex justify-between items-center mb-4">
    <span id="results-count" class="text-sm text-gray-500"></span>
    <span id="compare-btn" class="hidden">
        <button onclick="goToCompare()" class="bg-primary-600 text-white text-sm px-4 py-2 rounded-lg hover:bg-primary-700">
            Сравнить выбранные (<span id="compare-count">0</span>)
        </button>
    </span>
</div>

<!-- Job list -->
<div id="job-list" class="space-y-3"></div>

<!-- Pagination -->
<div id="pagination" class="flex justify-center gap-2 mt-6"></div>
{% endblock %}

{% block extra_js %}
<script>
    let compareSet = new Set(JSON.parse(localStorage.getItem('compareSet') || '[]'));
    let debounceTimer;

    function debounceLoad() {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(loadJobs, 300);
    }

    async function loadJobs(url) {
        const params = new URLSearchParams();
        const search = document.getElementById('f-search').value;
        const level = document.getElementById('f-level').value;
        const remote = document.getElementById('f-remote').value;
        const training = document.getElementById('f-training').value;
        const ordering = document.getElementById('f-ordering').value;
        const salaryMin = document.getElementById('f-salary-min').value;
        const salaryMax = document.getElementById('f-salary-max').value;
        const honesty = document.getElementById('f-honesty').value;

        if (search) params.set('search', search);
        if (level) params.set('level', level);
        if (remote) params.set('is_remote', remote);
        if (training) params.set('training_provided', training);
        if (ordering) params.set('ordering', ordering);
        if (salaryMin) params.set('salary_min', salaryMin);
        if (salaryMax) params.set('salary_max', salaryMax);
        if (honesty) params.set('min_honesty', honesty);

        const endpoint = url || `/jobs/?${params.toString()}`;
        try {
            const data = await api(endpoint);
            renderJobs(data);
        } catch(e) {
            document.getElementById('job-list').innerHTML = '<p class="text-red-500">Ошибка загрузки</p>';
        }
    }

    function renderJobs(data) {
        const list = document.getElementById('job-list');
        document.getElementById('results-count').textContent = `Найдено: ${data.count} вакансий`;

        if (!data.results || data.results.length === 0) {
            list.innerHTML = '<p class="text-gray-500 text-center py-8">Вакансии не найдены</p>';
            return;
        }

        list.innerHTML = data.results.map(job => {
            const checked = compareSet.has(job.id) ? 'checked' : '';
            const honestyColor = job.honesty_score >= 70 ? 'text-green-600' : job.honesty_score >= 40 ? 'text-yellow-600' : 'text-red-600';
            const overqualBadge = job.is_overqualified
                ? '<span class="text-xs px-2 py-0.5 rounded-full bg-red-100 text-red-700">Завышены</span>'
                : '';
            return `
            <div class="bg-white rounded-xl border shadow-sm p-4 hover:shadow-md transition fade-in cursor-pointer" onclick="window.location='/jobs/${job.id}/'">
                <div class="flex justify-between items-start">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <h3 class="font-semibold text-gray-900">${job.title}</h3>
                            ${levelBadge(job.level)}
                            ${job.detected_level && job.detected_level !== job.level ? '<span class="text-xs text-red-500">&#8594; ' + job.detected_level + '</span>' : ''}
                            ${overqualBadge}
                        </div>
                        <div class="text-sm text-gray-500 mb-2">
                            ${job.company} &middot; ${job.location}
                            ${job.is_remote ? '<span class="text-primary-600 ml-1">&#127760; Remote</span>' : ''}
                        </div>
                        <div class="flex flex-wrap gap-2 items-center text-xs">
                            <span class="font-medium">${formatSalary(job.salary_min, job.salary_max)}</span>
                            <span class="text-gray-300">|</span>
                            <span class="${honestyColor}">Честность: ${job.honesty_score}%</span>
                            <span class="text-gray-300">|</span>
                            <span>${job.experience_years} лет опыта</span>
                            ${job.training_provided ? '<span class="text-green-600">&#x2705; Обучение</span>' : ''}
                        </div>
                        <div class="flex flex-wrap gap-1 mt-2">
                            ${(job.tech_stack || []).slice(0, 6).map(t => `<span class="text-xs px-2 py-0.5 bg-gray-100 rounded">${t}</span>`).join('')}
                        </div>
                    </div>
                    <div class="flex flex-col items-end gap-2 ml-4" onclick="event.stopPropagation()">
                        <label class="flex items-center gap-1 text-xs text-gray-400 cursor-pointer">
                            <input type="checkbox" ${checked} onchange="toggleCompare(${job.id})" class="rounded">
                            Сравнить
                        </label>
                    </div>
                </div>
            </div>`;
        }).join('');

        // Pagination
        const pg = document.getElementById('pagination');
        pg.innerHTML = '';
        if (data.previous) {
            pg.innerHTML += `<button onclick="loadJobs('${data.previous.replace(window.location.origin, '')}')" class="px-3 py-1 bg-white border rounded text-sm hover:bg-gray-50">&larr; Назад</button>`;
        }
        if (data.next) {
            pg.innerHTML += `<button onclick="loadJobs('${data.next.replace(window.location.origin, '')}')" class="px-3 py-1 bg-white border rounded text-sm hover:bg-gray-50">Далее &rarr;</button>`;
        }

        updateCompareBtn();
    }

    function toggleCompare(jobId) {
        if (compareSet.has(jobId)) {
            compareSet.delete(jobId);
        } else if (compareSet.size < 4) {
            compareSet.add(jobId);
        } else {
            alert('Максимум 4 вакансии для сравнения');
            return;
        }
        localStorage.setItem('compareSet', JSON.stringify([...compareSet]));
        updateCompareBtn();
    }

    function updateCompareBtn() {
        const btn = document.getElementById('compare-btn');
        const count = document.getElementById('compare-count');
        if (compareSet.size >= 2) {
            btn.classList.remove('hidden');
            count.textContent = compareSet.size;
        } else {
            btn.classList.add('hidden');
        }
    }

    function goToCompare() {
        window.location = '/compare/?ids=' + [...compareSet].join(',');
    }

    function resetFilters() {
        document.getElementById('f-search').value = '';
        document.getElementById('f-level').value = '';
        document.getElementById('f-remote').value = '';
        document.getElementById('f-training').value = '';
        document.getElementById('f-ordering').value = '-created_at';
        document.getElementById('f-salary-min').value = '';
        document.getElementById('f-salary-max').value = '';
        document.getElementById('f-honesty').value = '';
        loadJobs();
    }

    function onUserChanged() { loadJobs(); }
    loadJobs();
    updateCompareBtn();
</script>
{% endblock %}
