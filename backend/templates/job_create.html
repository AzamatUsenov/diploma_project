{% extends "base.html" %}
{% block title %}Создать вакансию — JobPlatform{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-2xl font-bold mb-6">Создать вакансию</h1>
    <div class="bg-white rounded-xl border shadow-sm p-6">
        <form id="job-form" onsubmit="createJob(event)" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Название вакансии</label>
                <input type="text" name="title" required class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Junior Python Developer">
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Компания</label>
                    <input type="text" name="company" required class="w-full border rounded-lg px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Локация</label>
                    <input type="text" name="location" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Алматы">
                </div>
            </div>
            <div class="grid grid-cols-3 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Уровень</label>
                    <select name="level" class="w-full border rounded-lg px-3 py-2 text-sm">
                        <option value="junior">Junior</option>
                        <option value="mid">Mid</option>
                        <option value="senior">Senior</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ЗП от (₸)</label>
                    <input type="number" name="salary_min" class="w-full border rounded-lg px-3 py-2 text-sm">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">ЗП до (₸)</label>
                    <input type="number" name="salary_max" class="w-full border rounded-lg px-3 py-2 text-sm">
                </div>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Опыт (лет)</label>
                    <input type="number" name="experience_years" value="0" min="0" class="w-full border rounded-lg px-3 py-2 text-sm">
                </div>
                <div class="flex items-end gap-4 pb-1">
                    <label class="flex items-center gap-2 text-sm">
                        <input type="checkbox" name="is_remote" class="rounded"> Удалённо
                    </label>
                    <label class="flex items-center gap-2 text-sm">
                        <input type="checkbox" name="training_provided" class="rounded"> Обучение
                    </label>
                </div>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Технологии (через запятую)</label>
                <input type="text" name="tech_stack" class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Python, Django, PostgreSQL, Git">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Описание</label>
                <textarea name="description" rows="4" required class="w-full border rounded-lg px-3 py-2 text-sm"></textarea>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Требования</label>
                <textarea name="requirements_text" rows="4" required class="w-full border rounded-lg px-3 py-2 text-sm" placeholder="Знание Python, базовое понимание Django..."></textarea>
            </div>
            <div id="job-error" class="hidden text-sm text-red-600 bg-red-50 p-3 rounded-lg"></div>
            <button type="submit" class="w-full bg-primary-600 text-white py-2.5 rounded-lg font-medium hover:bg-primary-700">Опубликовать</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    if (!isLoggedIn()) { window.location = '/login/'; }
    const profile = getProfile();
    if (!profile || profile.role !== 'hr') {
        document.querySelector('main').innerHTML = '<p class="text-red-500 text-center py-12">Только HR может создавать вакансии</p>';
    }

    async function createJob(e) {
        e.preventDefault();
        const form = e.target;
        const errEl = document.getElementById('job-error');
        errEl.classList.add('hidden');

        const data = {
            title: form.title.value,
            company: form.company.value,
            location: form.location.value,
            level: form.level.value,
            salary_min: form.salary_min.value ? parseInt(form.salary_min.value) : null,
            salary_max: form.salary_max.value ? parseInt(form.salary_max.value) : null,
            experience_years: parseInt(form.experience_years.value) || 0,
            is_remote: form.is_remote.checked,
            training_provided: form.training_provided.checked,
            tech_stack: form.tech_stack.value.split(',').map(s => s.trim()).filter(Boolean),
            description: form.description.value,
            requirements_text: form.requirements_text.value,
        };

        try {
            const job = await api('/jobs/', { method: 'POST', body: data });
            toast('Вакансия опубликована!');
            window.location = `/jobs/${job.id}/`;
        } catch(err) {
            const msg = Object.values(err).flat().join(', ') || 'Ошибка создания';
            errEl.textContent = msg;
            errEl.classList.remove('hidden');
        }
    }
</script>
{% endblock %}
