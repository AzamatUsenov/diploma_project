{% extends "base.html" %}
{% block title %}Чат — JobPlatform{% endblock %}

{% block extra_css %}
<style>
    .chat-bubble { max-width: 75%; word-break: break-word; }
    .chat-bubble-mine { background: linear-gradient(135deg, #4f46e5, #6366f1); color: #fff; border-radius: 1.25rem 1.25rem 0.375rem 1.25rem; border: 2px solid #4338ca; }
    .chat-bubble-theirs { background: #f3f4f6; color: #1f2937; border-radius: 1.25rem 1.25rem 1.25rem 0.375rem; border: 2px solid #e5e7eb; }
    .dark .chat-bubble-theirs { background: #374151; color: #e5e7eb; border-color: #4b5563; }
    .typing-dot { animation: typingDot 1.4s infinite both; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingDot { 0%,80%,100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
    #chat-messages { scroll-behavior: smooth; }
</style>
{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto flex flex-col" style="height: calc(100vh - 12rem);">
    <!-- Header -->
    <div class="flex items-center gap-3 mb-4 slide-up">
        <a href="/applications/" class="p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition text-gray-500 dark:text-gray-400 hover:text-primary-600 dark:hover:text-primary-400 shrink-0 border-2 border-transparent hover:border-gray-200 dark:hover:border-gray-700">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </a>
        <div class="flex items-center gap-3 flex-1 min-w-0">
            <div id="chat-avatar" class="w-10 h-10 rounded-full bg-gradient-to-br from-primary-400 to-purple-500 flex items-center justify-center text-sm font-bold text-white shadow-sm shrink-0"></div>
            <div class="min-w-0">
                <h1 class="text-base font-bold text-gray-900 dark:text-gray-100 truncate" id="chat-title">Загрузка...</h1>
                <p class="text-xs text-gray-500 dark:text-gray-400 truncate" id="chat-subtitle"></p>
            </div>
        </div>
        <div class="flex items-center gap-2 shrink-0">
            <button id="btn-live-coding" onclick="openLiveModal()" class="hidden btn-ghost !text-xs flex items-center gap-1 text-primary-600 hover:text-primary-700">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
                Live Coding
            </button>
            <a id="chat-job-link" href="#" class="btn-ghost !text-xs flex items-center gap-1">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
                Вакансия
            </a>
        </div>
    </div>

    <!-- Messages area -->
    <div class="card-static flex-1 flex flex-col overflow-hidden">
        <div id="chat-messages" class="flex-1 overflow-y-auto p-5 space-y-3">
            <div class="flex justify-center py-12">
                <div class="w-8 h-8 border-3 border-primary-200 border-t-primary-600 rounded-full animate-spin"></div>
            </div>
        </div>

        <!-- Input area -->
        <div class="border-t border-gray-100 dark:border-gray-700 p-4">
            <form id="chat-form" onsubmit="sendMessage(event)" class="flex items-end gap-3">
                <div class="flex-1 relative">
                    <textarea id="chat-input" rows="1" placeholder="Напишите сообщение..." class="input-field !pr-4 resize-none max-h-32 border-2" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
                </div>
                <button type="submit" id="send-btn" class="btn-primary !p-2.5 !rounded-xl shrink-0" title="Отправить">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                </button>
            </form>
        </div>
    </div>
</div>
<!-- Live Coding Modal (HR only) -->
<div id="live-modal" class="hidden fixed inset-0 modal-overlay z-50 flex items-center justify-center p-4">
    <div class="bg-white dark:bg-gray-800 rounded-2xl shadow-2xl max-w-lg w-full max-h-[80vh] overflow-y-auto p-6 slide-up">
        <div class="flex justify-between items-center mb-4">
            <h2 class="text-lg font-bold text-gray-900 dark:text-gray-100">Live Coding сессия</h2>
            <button onclick="closeLiveModal()" class="text-gray-400 hover:text-gray-600 p-1 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <!-- Tabs: Create / Existing -->
        <div class="flex gap-2 mb-4">
            <button onclick="showLiveTab('create')" id="tab-create" class="text-xs px-3 py-1.5 rounded-lg font-medium bg-primary-600 text-white">Создать новую</button>
            <button onclick="showLiveTab('existing')" id="tab-existing" class="text-xs px-3 py-1.5 rounded-lg font-medium bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-400">Мои сессии</button>
        </div>

        <!-- Create session form -->
        <div id="live-tab-create">
            <form onsubmit="createAndSendInvite(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Название</label>
                    <input type="text" id="live-title" required class="input-field" placeholder="Backend интервью — Python">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Лимит времени (мин)</label>
                    <input type="number" id="live-time-limit" value="30" min="10" max="120" class="input-field">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1.5">Задачи</label>
                    <div id="live-task-picker" class="space-y-2 max-h-48 overflow-y-auto border dark:border-gray-600 rounded-xl p-2"></div>
                    <p class="text-xs text-gray-400 mt-1">Выберите задачи для сессии</p>
                </div>
                <button type="submit" id="btn-create-send" class="btn-primary w-full">Создать и отправить приглашение</button>
            </form>
        </div>

        <!-- Existing sessions -->
        <div id="live-tab-existing" class="hidden">
            <div id="existing-sessions-list" class="space-y-2">
                <div class="text-sm text-gray-400 text-center py-4">Загрузка...</div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    if (!isLoggedIn()) { window.location = '/login/'; }

    // Extract application ID from URL: /applications/28/chat/ -> 28
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const appId = pathParts[pathParts.indexOf('applications') + 1];

    console.log('Chat Debug:', {
        pathname: window.location.pathname,
        pathParts,
        appId,
        apiUrl: `/applications/${appId}/messages/`
    });

    const profile = getProfile();
    const myUserId = profile ? profile.user.id : null;
    let lastMessageId = 0;
    let pollInterval = null;

    async function initChat() {
        try {
            const app = await api(`/applications/${appId}/`);
            const isHR = profile.role === 'hr';
            const partnerName = isHR ? app.applicant_username : (app.job_company || 'HR');

            document.getElementById('chat-avatar').textContent = partnerName[0].toUpperCase();
            document.getElementById('chat-title').textContent = partnerName;
            document.getElementById('chat-subtitle').textContent = app.job_title;
            document.getElementById('chat-job-link').href = `/jobs/${app.job}/`;

            if (isHR) {
                document.getElementById('btn-live-coding').classList.remove('hidden');
            }

            await loadMessages();
            pollInterval = setInterval(loadMessages, 4000);

            if (isHR && window.location.hash === '#live') {
                openLiveModal();
            }
        } catch(e) {
            console.error('Chat init error:', e);
            document.getElementById('chat-messages').innerHTML = `
                <div class="text-center py-12">
                    <p class="text-danger-500 dark:text-danger-400 font-medium">Не удалось загрузить чат</p>
                    <p class="text-gray-500 dark:text-gray-400 text-sm mt-2">${e.detail || 'Проверьте авторизацию'}</p>
                    <a href="/applications/" class="btn-primary inline-block mt-4 !text-sm">К заявкам</a>
                </div>`;
        }
    }

    async function loadMessages() {
        try {
            const data = await api(`/applications/${appId}/messages/`);
            const messages = data.results || data;
            renderMessages(messages);
        } catch(e) {
            console.error('Load messages error:', e);
            if (e.status === 404) {
                toast('Чат не найден', 'error');
            }
        }
    }

    function renderMessages(messages) {
        const container = document.getElementById('chat-messages');
        const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 60;

        if (messages.length === 0) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full text-center">
                    <div class="w-16 h-16 rounded-full bg-primary-50 dark:bg-primary-900/30 flex items-center justify-center mb-4">
                        <svg class="w-8 h-8 text-primary-400 dark:text-primary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                    </div>
                    <p class="text-gray-500 dark:text-gray-400 font-medium">Начните диалог</p>
                    <p class="text-gray-400 dark:text-gray-500 text-sm mt-1">Напишите первое сообщение</p>
                </div>`;
            return;
        }

        const newLastId = messages[messages.length - 1].id;
        if (newLastId === lastMessageId) return;
        lastMessageId = newLastId;

        let currentDate = '';
        let html = '';

        messages.forEach(msg => {
            const msgDate = new Date(msg.created_at).toLocaleDateString('ru');
            if (msgDate !== currentDate) {
                currentDate = msgDate;
                const isToday = msgDate === new Date().toLocaleDateString('ru');
                const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
                const isYesterday = msgDate === yesterday.toLocaleDateString('ru');
                const dateLabel = isToday ? 'Сегодня' : isYesterday ? 'Вчера' : msgDate;
                html += `<div class="flex justify-center my-3"><span class="text-xs text-gray-400 dark:text-gray-500 bg-gray-100 dark:bg-gray-800 px-3 py-1 rounded-full font-medium border-2 border-gray-200 dark:border-gray-700">${dateLabel}</span></div>`;
            }

            const isMine = msg.sender === myUserId;
            const time = new Date(msg.created_at).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
            const readCheck = isMine && msg.is_read ? `<svg class="w-3.5 h-3.5 text-blue-300 inline ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>` : '';

            html += `
                <div class="flex ${isMine ? 'justify-end' : 'justify-start'}">
                    <div class="chat-bubble ${isMine ? 'chat-bubble-mine' : 'chat-bubble-theirs'} px-4 py-2.5">
                        ${!isMine ? `<div class="text-xs font-semibold mb-1 ${isMine ? 'text-white/70' : 'text-primary-600'}">${msg.sender_username}</div>` : ''}
                        <div class="text-sm leading-relaxed whitespace-pre-wrap">${escapeHtml(msg.text)}</div>
                        <div class="text-xs ${isMine ? 'text-white/60' : 'text-gray-400'} mt-1 text-right">${time}${readCheck}</div>
                    </div>
                </div>`;
        });

        container.innerHTML = html;

        if (wasAtBottom || lastMessageId === 0) {
            container.scrollTop = container.scrollHeight;
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        let html = div.innerHTML;
        html = html.replace(/(\/live\/\?code=[A-Z0-9]+)/g, '<a href="$1" class="underline font-medium hover:opacity-80">$1</a>');
        return html;
    }

    async function sendMessage(e) {
        e.preventDefault();
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;

        const btn = document.getElementById('send-btn');
        btn.disabled = true;

        try {
            await api(`/applications/${appId}/send/`, {
                method: 'POST',
                body: { text },
            });
            input.value = '';
            input.style.height = 'auto';
            lastMessageId = 0;
            await loadMessages();
        } catch(e) {
            console.error('Send message error:', e);
            const msg = e.status === 404 ? 'Чат не найден (404)' : 'Ошибка отправки';
            toast(msg, 'error');
        } finally {
            btn.disabled = false;
            input.focus();
        }
    }

    function handleKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            document.getElementById('chat-form').dispatchEvent(new Event('submit'));
        }
    }

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 128) + 'px';
    }

    window.addEventListener('beforeunload', () => {
        if (pollInterval) clearInterval(pollInterval);
    });

    // ---- Live Coding Modal (HR) ----

    function openLiveModal() {
        document.getElementById('live-modal').classList.remove('hidden');
        loadLiveTaskPicker();
        showLiveTab('create');
    }

    function closeLiveModal() {
        document.getElementById('live-modal').classList.add('hidden');
    }

    function showLiveTab(tab) {
        const createTab = document.getElementById('live-tab-create');
        const existingTab = document.getElementById('live-tab-existing');
        const btnCreate = document.getElementById('tab-create');
        const btnExisting = document.getElementById('tab-existing');

        if (tab === 'create') {
            createTab.classList.remove('hidden');
            existingTab.classList.add('hidden');
            btnCreate.className = 'text-xs px-3 py-1.5 rounded-lg font-medium bg-primary-600 text-white';
            btnExisting.className = 'text-xs px-3 py-1.5 rounded-lg font-medium bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-400';
        } else {
            createTab.classList.add('hidden');
            existingTab.classList.remove('hidden');
            btnExisting.className = 'text-xs px-3 py-1.5 rounded-lg font-medium bg-primary-600 text-white';
            btnCreate.className = 'text-xs px-3 py-1.5 rounded-lg font-medium bg-gray-100 text-gray-600 dark:bg-gray-700 dark:text-gray-400';
            loadExistingSessions();
        }
    }

    async function loadLiveTaskPicker() {
        try {
            const tasks = await api('/live/sessions/available-tasks/');
            const picker = document.getElementById('live-task-picker');
            if (tasks.length === 0) {
                picker.innerHTML = '<p class="text-sm text-gray-400">Нет доступных code-задач</p>';
                return;
            }
            picker.innerHTML = tasks.map(q => `
                <label class="flex items-center gap-2 p-2 rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 cursor-pointer">
                    <input type="checkbox" name="live_questions" value="${q.id}" class="rounded text-primary-600">
                    <span class="text-sm flex-1">${q.text.substring(0, 50)}...</span>
                    <span class="text-xs text-gray-400">${q.language}</span>
                </label>`).join('');
        } catch(e) {
            document.getElementById('live-task-picker').innerHTML = '<p class="text-sm text-danger-500">Ошибка загрузки задач</p>';
        }
    }

    async function createAndSendInvite(e) {
        e.preventDefault();
        const checked = [...document.querySelectorAll('input[name="live_questions"]:checked')];
        if (checked.length === 0) { toast('Выберите хотя бы одну задачу', 'error'); return; }

        const btn = document.getElementById('btn-create-send');
        btn.disabled = true;
        btn.textContent = 'Создание...';

        try {
            const session = await api('/live/sessions/', {
                method: 'POST',
                body: {
                    title: document.getElementById('live-title').value,
                    time_limit_minutes: parseInt(document.getElementById('live-time-limit').value),
                    question_ids: checked.map(c => parseInt(c.value)),
                }
            });

            btn.textContent = 'Отправка приглашения...';

            await api(`/live/sessions/${session.id}/send-invite/`, {
                method: 'POST',
                body: { application_id: parseInt(appId) }
            });

            toast('Приглашение отправлено в чат!');
            closeLiveModal();
            lastMessageId = 0;
            await loadMessages();
        } catch(e) {
            toast('Ошибка: ' + (e.detail || 'Не удалось создать сессию'), 'error');
        } finally {
            btn.disabled = false;
            btn.textContent = 'Создать и отправить приглашение';
        }
    }

    async function loadExistingSessions() {
        try {
            const data = await api('/live/sessions/');
            const sessions = data.results || data;
            const container = document.getElementById('existing-sessions-list');

            if (sessions.length === 0) {
                container.innerHTML = '<p class="text-sm text-gray-400 text-center py-4">Нет созданных сессий</p>';
                return;
            }

            container.innerHTML = sessions.filter(s => s.status === 'waiting').map(s => `
                <div class="flex items-center justify-between p-3 rounded-xl bg-gray-50 dark:bg-gray-700">
                    <div>
                        <div class="text-sm font-medium text-gray-900 dark:text-gray-100">${s.title}</div>
                        <div class="text-xs text-gray-500">Код: <span class="font-mono font-bold text-primary-600">${s.invite_code}</span> · ${s.time_limit_minutes} мин</div>
                    </div>
                    <button onclick="sendExistingInvite('${s.id}')" class="btn-primary !text-xs !py-1.5 !px-3">
                        Отправить
                    </button>
                </div>
            `).join('') || '<p class="text-sm text-gray-400 text-center py-4">Нет ожидающих сессий</p>';
        } catch(e) {
            document.getElementById('existing-sessions-list').innerHTML = '<p class="text-sm text-danger-500">Ошибка загрузки</p>';
        }
    }

    async function sendExistingInvite(sessionId) {
        try {
            await api(`/live/sessions/${sessionId}/send-invite/`, {
                method: 'POST',
                body: { application_id: parseInt(appId) }
            });
            toast('Приглашение отправлено!');
            closeLiveModal();
            lastMessageId = 0;
            await loadMessages();
        } catch(e) {
            toast('Ошибка отправки: ' + (e.detail || ''), 'error');
        }
    }

    initChat();
</script>
{% endblock %}
