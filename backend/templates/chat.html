{% extends "base.html" %}
{% block title %}Чат — JobPlatform{% endblock %}

{% block extra_css %}
<style>
    .chat-bubble { max-width: 75%; word-break: break-word; }
    .chat-bubble-mine { background: linear-gradient(135deg, #4f46e5, #6366f1); color: #fff; border-radius: 1.25rem 1.25rem 0.375rem 1.25rem; border: 2px solid #4338ca; }
    .chat-bubble-theirs { background: #f3f4f6; color: #1f2937; border-radius: 1.25rem 1.25rem 1.25rem 0.375rem; border: 2px solid #e5e7eb; }
    .dark .chat-bubble-theirs { background: #374151; color: #e5e7eb; border-color: #4b5563; }
    .typing-dot { animation: typingDot 1.4s infinite both; }
    .typing-dot:nth-child(2) { animation-delay: 0.2s; }
    .typing-dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes typingDot { 0%,80%,100% { opacity: 0.3; transform: scale(0.8); } 40% { opacity: 1; transform: scale(1); } }
    #chat-messages { scroll-behavior: smooth; }
</style>
{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto flex flex-col" style="height: calc(100vh - 12rem);">
    <!-- Header -->
    <div class="flex items-center gap-3 mb-4 slide-up">
        <a href="/applications/" class="p-2 rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition text-gray-500 dark:text-gray-400 hover:text-primary-600 dark:hover:text-primary-400 shrink-0 border-2 border-transparent hover:border-gray-200 dark:hover:border-gray-700">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
        </a>
        <div class="flex items-center gap-3 flex-1 min-w-0">
            <div id="chat-avatar" class="w-10 h-10 rounded-full bg-gradient-to-br from-primary-400 to-purple-500 flex items-center justify-center text-sm font-bold text-white shadow-sm shrink-0"></div>
            <div class="min-w-0">
                <h1 class="text-base font-bold text-gray-900 dark:text-gray-100 truncate" id="chat-title">Загрузка...</h1>
                <p class="text-xs text-gray-500 dark:text-gray-400 truncate" id="chat-subtitle"></p>
            </div>
        </div>
        <a id="chat-job-link" href="#" class="btn-ghost !text-xs flex items-center gap-1 shrink-0">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/></svg>
            Вакансия
        </a>
    </div>

    <!-- Messages area -->
    <div class="card-static flex-1 flex flex-col overflow-hidden">
        <div id="chat-messages" class="flex-1 overflow-y-auto p-5 space-y-3">
            <div class="flex justify-center py-12">
                <div class="w-8 h-8 border-3 border-primary-200 border-t-primary-600 rounded-full animate-spin"></div>
            </div>
        </div>

        <!-- Input area -->
        <div class="border-t border-gray-100 dark:border-gray-700 p-4">
            <form id="chat-form" onsubmit="sendMessage(event)" class="flex items-end gap-3">
                <div class="flex-1 relative">
                    <textarea id="chat-input" rows="1" placeholder="Напишите сообщение..." class="input-field !pr-4 resize-none max-h-32 border-2" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
                </div>
                <button type="submit" id="send-btn" class="btn-primary !p-2.5 !rounded-xl shrink-0" title="Отправить">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/></svg>
                </button>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    if (!isLoggedIn()) { window.location = '/login/'; }

    // Extract application ID from URL: /applications/28/chat/ -> 28
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const appId = pathParts[pathParts.indexOf('applications') + 1];

    console.log('Chat Debug:', {
        pathname: window.location.pathname,
        pathParts,
        appId,
        apiUrl: `/applications/${appId}/messages/`
    });

    const profile = getProfile();
    const myUserId = profile ? profile.user.id : null;
    let lastMessageId = 0;
    let pollInterval = null;

    async function initChat() {
        try {
            const app = await api(`/applications/${appId}/`);
            const isHR = profile.role === 'hr';
            const partnerName = isHR ? app.applicant_username : (app.job_company || 'HR');

            document.getElementById('chat-avatar').textContent = partnerName[0].toUpperCase();
            document.getElementById('chat-title').textContent = partnerName;
            document.getElementById('chat-subtitle').textContent = app.job_title;
            document.getElementById('chat-job-link').href = `/jobs/${app.job}/`;

            await loadMessages();
            pollInterval = setInterval(loadMessages, 4000);
        } catch(e) {
            console.error('Chat init error:', e);
            document.getElementById('chat-messages').innerHTML = `
                <div class="text-center py-12">
                    <p class="text-danger-500 dark:text-danger-400 font-medium">Не удалось загрузить чат</p>
                    <p class="text-gray-500 dark:text-gray-400 text-sm mt-2">${e.detail || 'Проверьте авторизацию'}</p>
                    <a href="/applications/" class="btn-primary inline-block mt-4 !text-sm">К заявкам</a>
                </div>`;
        }
    }

    async function loadMessages() {
        try {
            const data = await api(`/applications/${appId}/messages/`);
            const messages = data.results || data;
            renderMessages(messages);
        } catch(e) {
            console.error('Load messages error:', e);
            if (e.status === 404) {
                toast('Чат не найден', 'error');
            }
        }
    }

    function renderMessages(messages) {
        const container = document.getElementById('chat-messages');
        const wasAtBottom = container.scrollHeight - container.scrollTop - container.clientHeight < 60;

        if (messages.length === 0) {
            container.innerHTML = `
                <div class="flex flex-col items-center justify-center h-full text-center">
                    <div class="w-16 h-16 rounded-full bg-primary-50 dark:bg-primary-900/30 flex items-center justify-center mb-4">
                        <svg class="w-8 h-8 text-primary-400 dark:text-primary-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                    </div>
                    <p class="text-gray-500 dark:text-gray-400 font-medium">Начните диалог</p>
                    <p class="text-gray-400 dark:text-gray-500 text-sm mt-1">Напишите первое сообщение</p>
                </div>`;
            return;
        }

        const newLastId = messages[messages.length - 1].id;
        if (newLastId === lastMessageId) return;
        lastMessageId = newLastId;

        let currentDate = '';
        let html = '';

        messages.forEach(msg => {
            const msgDate = new Date(msg.created_at).toLocaleDateString('ru');
            if (msgDate !== currentDate) {
                currentDate = msgDate;
                const isToday = msgDate === new Date().toLocaleDateString('ru');
                const yesterday = new Date(); yesterday.setDate(yesterday.getDate()-1);
                const isYesterday = msgDate === yesterday.toLocaleDateString('ru');
                const dateLabel = isToday ? 'Сегодня' : isYesterday ? 'Вчера' : msgDate;
                html += `<div class="flex justify-center my-3"><span class="text-xs text-gray-400 dark:text-gray-500 bg-gray-100 dark:bg-gray-800 px-3 py-1 rounded-full font-medium border-2 border-gray-200 dark:border-gray-700">${dateLabel}</span></div>`;
            }

            const isMine = msg.sender === myUserId;
            const time = new Date(msg.created_at).toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
            const readCheck = isMine && msg.is_read ? `<svg class="w-3.5 h-3.5 text-blue-300 inline ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>` : '';

            html += `
                <div class="flex ${isMine ? 'justify-end' : 'justify-start'}">
                    <div class="chat-bubble ${isMine ? 'chat-bubble-mine' : 'chat-bubble-theirs'} px-4 py-2.5">
                        ${!isMine ? `<div class="text-xs font-semibold mb-1 ${isMine ? 'text-white/70' : 'text-primary-600'}">${msg.sender_username}</div>` : ''}
                        <div class="text-sm leading-relaxed whitespace-pre-wrap">${escapeHtml(msg.text)}</div>
                        <div class="text-xs ${isMine ? 'text-white/60' : 'text-gray-400'} mt-1 text-right">${time}${readCheck}</div>
                    </div>
                </div>`;
        });

        container.innerHTML = html;

        if (wasAtBottom || lastMessageId === 0) {
            container.scrollTop = container.scrollHeight;
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    async function sendMessage(e) {
        e.preventDefault();
        const input = document.getElementById('chat-input');
        const text = input.value.trim();
        if (!text) return;

        const btn = document.getElementById('send-btn');
        btn.disabled = true;

        try {
            await api(`/applications/${appId}/send/`, {
                method: 'POST',
                body: { text },
            });
            input.value = '';
            input.style.height = 'auto';
            lastMessageId = 0;
            await loadMessages();
        } catch(e) {
            console.error('Send message error:', e);
            const msg = e.status === 404 ? 'Чат не найден (404)' : 'Ошибка отправки';
            toast(msg, 'error');
        } finally {
            btn.disabled = false;
            input.focus();
        }
    }

    function handleKey(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            document.getElementById('chat-form').dispatchEvent(new Event('submit'));
        }
    }

    function autoResize(el) {
        el.style.height = 'auto';
        el.style.height = Math.min(el.scrollHeight, 128) + 'px';
    }

    window.addEventListener('beforeunload', () => {
        if (pollInterval) clearInterval(pollInterval);
    });

    initChat();
</script>
{% endblock %}
