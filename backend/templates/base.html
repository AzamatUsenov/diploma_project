<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JobPlatform{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: {
                        primary: {
                            50: '#eef2ff', 100: '#e0e7ff', 200: '#c7d2fe', 300: '#a5b4fc',
                            400: '#818cf8', 500: '#6366f1', 600: '#4f46e5', 700: '#4338ca',
                            800: '#3730a3', 900: '#312e81',
                        },
                        success: { 50: '#ecfdf5', 100: '#d1fae5', 500: '#10b981', 600: '#059669', 700: '#047857' },
                        warning: { 50: '#fffbeb', 100: '#fef3c7', 500: '#f59e0b', 600: '#d97706', 700: '#b45309' },
                        danger: { 50: '#fef2f2', 100: '#fee2e2', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c' },
                    }
                }
            }
        }
    </script>
    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }
        [x-cloak] { display: none !important; }
        .fade-in { animation: fadeIn 0.4s ease-out; }
        .slide-up { animation: slideUp 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .score-bar { transition: width 1s cubic-bezier(0.4, 0, 0.2, 1); }
        .btn-primary { @apply bg-primary-600 text-white px-5 py-2.5 rounded-xl font-medium hover:bg-primary-700 transition-all duration-200 shadow-sm hover:shadow-md; }
        .btn-secondary { @apply bg-white text-gray-700 px-5 py-2.5 rounded-xl font-medium border border-gray-200 hover:bg-gray-50 hover:border-gray-300 transition-all duration-200; }
        .btn-ghost { @apply text-gray-600 px-4 py-2 rounded-lg hover:bg-gray-100 transition-all duration-200 text-sm font-medium; }
        .card { @apply bg-white rounded-2xl border border-gray-100 shadow-sm hover:shadow-md transition-shadow duration-300; }
        .input-field { @apply w-full border border-gray-200 rounded-xl px-4 py-2.5 text-sm focus:ring-2 focus:ring-primary-500/20 focus:border-primary-500 outline-none transition-all duration-200; }
        .toast { position: fixed; top: 24px; right: 24px; z-index: 200; padding: 14px 24px; border-radius: 12px; color: #fff; font-size: 14px; font-weight: 500; animation: slideIn 0.3s ease-out; box-shadow: 0 8px 32px -4px rgba(0,0,0,0.2); }
        .toast-success { background: linear-gradient(135deg, #10b981, #059669); }
        .toast-error { background: linear-gradient(135deg, #ef4444, #dc2626); }
        @keyframes slideIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: translateX(0); } }
        .gradient-text { background: linear-gradient(135deg, #4f46e5, #7c3aed); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        .glass { background: rgba(255,255,255,0.8); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .modal-overlay { background: rgba(0,0,0,0.4); backdrop-filter: blur(4px); }
        input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-50/50 min-h-screen flex flex-col">
    <nav class="glass border-b border-gray-200/60 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center gap-1">
                    <a href="/" class="flex items-center gap-2 mr-6">
                        <div class="w-8 h-8 rounded-lg bg-primary-600 flex items-center justify-center">
                            <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                        </div>
                        <span class="text-lg font-bold text-gray-900">JobPlatform</span>
                    </a>
                    <a href="/jobs/" class="btn-ghost">Вакансии</a>
                    <a href="/tests/" class="btn-ghost">Тесты</a>
                </div>
                <div class="flex items-center gap-2">
                    <div id="nav-guest" class="hidden items-center gap-2">
                        <a href="/login/" class="btn-ghost">Войти</a>
                        <a href="/register/" class="btn-primary text-sm !py-2 !px-4">Регистрация</a>
                    </div>
                    <div id="nav-user" class="hidden items-center gap-1">
                        <a id="nav-create-job" href="/jobs/create/" class="hidden btn-ghost !text-success-600 !hover:bg-success-50">
                            <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>Вакансия
                        </a>
                        <a href="/applications/" class="btn-ghost">Заявки</a>
                        <a href="/favorites/" class="btn-ghost">Избранное</a>
                        <div class="flex items-center gap-2 ml-2 pl-2 border-l border-gray-200">
                            <a href="/profile/" class="flex items-center gap-2 hover:bg-gray-100 rounded-lg px-2 py-1.5 transition-all">
                                <div id="nav-avatar" class="w-8 h-8 rounded-full bg-primary-100 flex items-center justify-center text-sm font-semibold text-primary-700"></div>
                                <span class="text-sm font-medium text-gray-700" id="nav-username"></span>
                                <span id="nav-role-badge" class="text-xs px-2 py-0.5 rounded-full font-medium"></span>
                            </a>
                            <button onclick="logout()" class="text-gray-400 hover:text-danger-500 p-1.5 rounded-lg hover:bg-danger-50 transition-all" title="Выйти">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t mt-auto">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-2">
                    <div class="w-6 h-6 rounded bg-primary-600 flex items-center justify-center">
                        <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                    </div>
                    <span class="text-sm font-medium text-gray-500">JobPlatform &copy; 2026</span>
                </div>
                <div class="flex gap-6 text-sm text-gray-400">
                    <a href="/jobs/" class="hover:text-gray-600 transition">Вакансии</a>
                    <a href="/tests/" class="hover:text-gray-600 transition">Тесты</a>
                    <a href="/api/docs/" class="hover:text-gray-600 transition">API Docs</a>
                </div>
            </div>
        </div>
    </footer>

    <script>
        const API = '/api';

        function getTokens() {
            const t = localStorage.getItem('tokens');
            return t ? JSON.parse(t) : null;
        }

        function getProfile() {
            const p = localStorage.getItem('profile');
            return p ? JSON.parse(p) : null;
        }

        function saveAuth(data) {
            localStorage.setItem('tokens', JSON.stringify(data.tokens));
            localStorage.setItem('profile', JSON.stringify(data.user));
            updateNav();
        }

        function clearAuth() {
            localStorage.removeItem('tokens');
            localStorage.removeItem('profile');
            updateNav();
        }

        function isLoggedIn() { return !!getTokens(); }

        function logout() {
            clearAuth();
            window.location = '/';
        }

        async function refreshAccessToken() {
            const tokens = getTokens();
            if (!tokens || !tokens.refresh) { clearAuth(); return null; }
            try {
                const res = await fetch(`${API}/accounts/token/refresh/`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ refresh: tokens.refresh }),
                });
                if (!res.ok) { clearAuth(); return null; }
                const data = await res.json();
                tokens.access = data.access;
                localStorage.setItem('tokens', JSON.stringify(tokens));
                return tokens.access;
            } catch { clearAuth(); return null; }
        }

        async function api(path, options = {}) {
            const url = path.startsWith('http') ? path : `${API}${path}`;
            const headers = { 'Content-Type': 'application/json', ...options.headers };
            const tokens = getTokens();
            if (tokens && tokens.access) {
                headers['Authorization'] = `Bearer ${tokens.access}`;
            }
            if (options.body && typeof options.body === 'object') {
                options.body = JSON.stringify(options.body);
            }
            let res = await fetch(url, { ...options, headers });
            if (res.status === 401 && tokens) {
                const newAccess = await refreshAccessToken();
                if (newAccess) {
                    headers['Authorization'] = `Bearer ${newAccess}`;
                    res = await fetch(url, { ...options, headers });
                }
            }
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw { status: res.status, ...err };
            }
            if (res.status === 204) return {};
            return res.json();
        }

        function updateNav() {
            const profile = getProfile();
            const guest = document.getElementById('nav-guest');
            const user = document.getElementById('nav-user');
            if (profile && isLoggedIn()) {
                guest.classList.add('hidden');
                user.classList.remove('hidden');
                user.classList.add('flex');
                document.getElementById('nav-username').textContent = profile.user.username;
                document.getElementById('nav-avatar').textContent = profile.user.username[0].toUpperCase();
                const badge = document.getElementById('nav-role-badge');
                const colors = { applicant: 'bg-success-50 text-success-700', hr: 'bg-warning-50 text-warning-700' };
                const labels = { applicant: 'Соискатель', hr: 'HR' };
                badge.className = `text-xs px-2 py-0.5 rounded-full font-medium ${colors[profile.role] || 'bg-gray-100'}`;
                badge.textContent = labels[profile.role] || profile.role;
                const createJobLink = document.getElementById('nav-create-job');
                if (profile.role === 'hr') createJobLink.classList.remove('hidden');
                else createJobLink.classList.add('hidden');
            } else {
                guest.classList.remove('hidden');
                guest.classList.add('flex');
                user.classList.add('hidden');
            }
        }

        function toast(msg, type = 'success') {
            const el = document.createElement('div');
            el.className = `toast toast-${type}`;
            el.textContent = msg;
            document.body.appendChild(el);
            setTimeout(() => { el.style.opacity = '0'; el.style.transition = 'opacity 0.3s'; }, 2500);
            setTimeout(() => el.remove(), 3000);
        }

        function requireAuth() {
            if (!isLoggedIn()) {
                toast('Войдите в аккаунт', 'error');
                setTimeout(() => window.location = '/login/', 500);
                return false;
            }
            return true;
        }

        function scoreBar(score, max = 100) {
            const pct = Math.round((score / max) * 100);
            const color = pct >= 70 ? 'bg-success-500' : pct >= 40 ? 'bg-warning-500' : 'bg-danger-500';
            return `<div class="w-full bg-gray-100 rounded-full h-2"><div class="score-bar ${color} h-2 rounded-full" style="width:${pct}%"></div></div>`;
        }

        function levelBadge(level) {
            const colors = {
                junior: 'bg-emerald-50 text-emerald-700 ring-1 ring-emerald-200',
                mid: 'bg-blue-50 text-blue-700 ring-1 ring-blue-200',
                senior: 'bg-purple-50 text-purple-700 ring-1 ring-purple-200',
            };
            const labels = { junior: 'Junior', mid: 'Middle', senior: 'Senior' };
            return `<span class="text-xs px-2.5 py-1 rounded-lg font-medium ${colors[level] || 'bg-gray-100'}">${labels[level] || level}</span>`;
        }

        function formatSalary(min, max) {
            const fmt = n => n ? (n >= 1000000 ? (n/1000000).toFixed(1) + 'M' : Math.round(n/1000) + 'K') : '?';
            if (min && max) return `${fmt(min)} - ${fmt(max)} ₸`;
            if (max) return `до ${fmt(max)} ₸`;
            if (min) return `от ${fmt(min)} ₸`;
            return 'Не указана';
        }

        function timeAgo(date) {
            const now = new Date();
            const d = new Date(date);
            const diff = Math.floor((now - d) / 1000);
            if (diff < 60) return 'только что';
            if (diff < 3600) return Math.floor(diff / 60) + ' мин назад';
            if (diff < 86400) return Math.floor(diff / 3600) + ' ч назад';
            if (diff < 2592000) return Math.floor(diff / 86400) + ' дн назад';
            return d.toLocaleDateString('ru');
        }

        function loader() {
            return `<div class="flex justify-center py-12"><div class="w-8 h-8 border-3 border-primary-200 border-t-primary-600 rounded-full animate-spin"></div></div>`;
        }

        updateNav();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
