<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}JobPlatform{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 50: '#eff6ff', 100: '#dbeafe', 500: '#3b82f6', 600: '#2563eb', 700: '#1d4ed8' },
                        success: { 50: '#f0fdf4', 500: '#22c55e', 700: '#15803d' },
                        warning: { 50: '#fffbeb', 500: '#f59e0b', 700: '#b45309' },
                        danger: { 50: '#fef2f2', 500: '#ef4444', 700: '#b91c1c' },
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .fade-in { animation: fadeIn 0.3s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
        .score-bar { transition: width 0.8s ease-out; }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen flex flex-col">
    <nav class="bg-white shadow-sm border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-14">
                <div class="flex items-center space-x-6">
                    <a href="/" class="text-xl font-bold text-primary-600">JobPlatform</a>
                    <a href="/jobs/" class="text-sm text-gray-600 hover:text-primary-600">Вакансии</a>
                    <a href="/tests/" class="text-sm text-gray-600 hover:text-primary-600">Тесты</a>
                    <a href="/compare/" class="text-sm text-gray-600 hover:text-primary-600">Сравнение</a>
                </div>
                <div class="flex items-center space-x-3">
                    <select id="user-selector" class="text-sm border rounded px-2 py-1 text-gray-600" onchange="switchUser(this.value)">
                        <option value="">Выберите пользователя</option>
                    </select>
                    <span id="user-badge" class="hidden text-xs px-2 py-1 rounded-full bg-primary-100 text-primary-700"></span>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-1 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 w-full">
        {% block content %}{% endblock %}
    </main>

    <footer class="bg-white border-t mt-auto">
        <div class="max-w-7xl mx-auto px-4 py-4 text-center text-sm text-gray-500">
            JobPlatform &copy; 2026 &mdash; Дипломный проект
        </div>
    </footer>

    <script>
        const API = '/api';

        // Current user state
        let currentUser = JSON.parse(localStorage.getItem('currentUser') || 'null');
        let currentProfile = JSON.parse(localStorage.getItem('currentProfile') || 'null');

        // API helper
        async function api(path, options = {}) {
            const url = path.startsWith('http') ? path : `${API}${path}`;
            const config = { headers: { 'Content-Type': 'application/json' }, ...options };
            if (config.body && typeof config.body === 'object') {
                config.body = JSON.stringify(config.body);
            }
            const res = await fetch(url, config);
            if (!res.ok) {
                const err = await res.json().catch(() => ({}));
                throw { status: res.status, ...err };
            }
            return res.json();
        }

        // Load users into selector
        async function loadUsers() {
            try {
                const data = await api('/accounts/profiles/');
                const sel = document.getElementById('user-selector');
                (data.results || []).forEach(p => {
                    const opt = document.createElement('option');
                    opt.value = p.id;
                    opt.textContent = `${p.user.username} (${p.role}/${p.level || '-'})`;
                    if (currentProfile && currentProfile.id === p.id) opt.selected = true;
                    sel.appendChild(opt);
                });
                if (currentProfile) updateUserBadge();
            } catch (e) {
                console.error('Failed to load users:', e);
            }
        }

        function switchUser(profileId) {
            if (!profileId) {
                currentUser = null;
                currentProfile = null;
                localStorage.removeItem('currentUser');
                localStorage.removeItem('currentProfile');
                document.getElementById('user-badge').classList.add('hidden');
                return;
            }
            api(`/accounts/profiles/${profileId}/`).then(p => {
                currentProfile = p;
                currentUser = p.user;
                localStorage.setItem('currentUser', JSON.stringify(p.user));
                localStorage.setItem('currentProfile', JSON.stringify(p));
                updateUserBadge();
                if (typeof onUserChanged === 'function') onUserChanged();
            });
        }

        function updateUserBadge() {
            const badge = document.getElementById('user-badge');
            if (currentProfile) {
                badge.textContent = `${currentProfile.level || currentProfile.role}`;
                badge.classList.remove('hidden');
                const colors = {
                    junior: 'bg-green-100 text-green-700',
                    mid: 'bg-blue-100 text-blue-700',
                    senior: 'bg-purple-100 text-purple-700',
                    hr: 'bg-orange-100 text-orange-700',
                };
                badge.className = `text-xs px-2 py-1 rounded-full ${colors[currentProfile.level] || colors[currentProfile.role] || 'bg-gray-100 text-gray-700'}`;
            } else {
                badge.classList.add('hidden');
            }
        }

        // Score bar helper
        function scoreBar(score, max = 100) {
            const pct = Math.round((score / max) * 100);
            const color = pct >= 70 ? 'bg-green-500' : pct >= 40 ? 'bg-yellow-500' : 'bg-red-500';
            return `<div class="w-full bg-gray-200 rounded-full h-2"><div class="score-bar ${color} h-2 rounded-full" style="width:${pct}%"></div></div>`;
        }

        // Level badge helper
        function levelBadge(level) {
            const colors = { junior: 'bg-green-100 text-green-800', mid: 'bg-blue-100 text-blue-800', senior: 'bg-purple-100 text-purple-800' };
            return `<span class="text-xs px-2 py-0.5 rounded-full ${colors[level] || 'bg-gray-100'}">${level}</span>`;
        }

        // Format salary
        function formatSalary(min, max) {
            const fmt = n => n ? (n >= 1000000 ? (n/1000000).toFixed(1) + 'M' : Math.round(n/1000) + 'K') : '?';
            if (min && max) return `${fmt(min)} - ${fmt(max)} ₸`;
            if (max) return `до ${fmt(max)} ₸`;
            if (min) return `от ${fmt(min)} ₸`;
            return 'Не указана';
        }

        // Init
        loadUsers();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
