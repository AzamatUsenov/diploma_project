{% extends "base.html" %}
{% block title %}Вакансия — JobPlatform{% endblock %}

{% block content %}
<div id="job-detail" class="space-y-6">
    <p class="text-gray-500">Загрузка...</p>
</div>
{% endblock %}

{% block extra_js %}
<script>
    const jobId = window.location.pathname.split('/').filter(Boolean).pop();

    async function loadJob() {
        try {
            const job = await api(`/jobs/${jobId}/`);
            const analysis = await api(`/analytics/analyze/${jobId}/`);

            let matchHtml = '';
            if (currentUser) {
                try {
                    const match = await api('/analytics/match/', {
                        method: 'POST',
                        body: { user_id: currentUser.id, job_id: parseInt(jobId) },
                    });
                    matchHtml = renderMatch(match);
                } catch(e) {}
            }

            document.getElementById('job-detail').innerHTML = `
                <a href="/jobs/" class="text-sm text-primary-600 hover:underline">&larr; Все вакансии</a>

                <!-- Header -->
                <div class="bg-white rounded-xl border shadow-sm p-6">
                    <div class="flex justify-between items-start">
                        <div>
                            <div class="flex items-center gap-2 mb-1">
                                <h1 class="text-2xl font-bold">${job.title}</h1>
                                ${levelBadge(job.level)}
                            </div>
                            <p class="text-gray-500">${job.company} &middot; ${job.location} ${job.is_remote ? '<span class="text-primary-600">&#127760; Remote</span>' : ''}</p>
                        </div>
                        <div class="text-right">
                            <div class="text-lg font-bold">${formatSalary(job.salary_min, job.salary_max)}</div>
                            <div class="text-sm text-gray-500">${job.experience_years} лет опыта</div>
                        </div>
                    </div>
                    <div class="flex flex-wrap gap-2 mt-4">
                        ${(job.tech_stack || []).map(t => `<span class="text-sm px-3 py-1 bg-primary-50 text-primary-700 rounded-full">${t}</span>`).join('')}
                        ${job.training_provided ? '<span class="text-sm px-3 py-1 bg-green-50 text-green-700 rounded-full">&#x2705; Обучение</span>' : ''}
                    </div>
                </div>

                <!-- Analysis -->
                <div class="bg-white rounded-xl border shadow-sm p-6">
                    <h2 class="font-semibold text-lg mb-4">Анализ вакансии</h2>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-4">
                        <div class="text-center p-3 rounded-lg ${analysis.honesty_score >= 70 ? 'bg-green-50' : analysis.honesty_score >= 40 ? 'bg-yellow-50' : 'bg-red-50'}">
                            <div class="text-2xl font-bold ${analysis.honesty_score >= 70 ? 'text-green-600' : analysis.honesty_score >= 40 ? 'text-yellow-600' : 'text-red-600'}">${analysis.honesty_score}%</div>
                            <div class="text-xs text-gray-500">Честность</div>
                        </div>
                        <div class="text-center p-3 rounded-lg bg-gray-50">
                            <div class="text-2xl font-bold">${analysis.detected_level}</div>
                            <div class="text-xs text-gray-500">Реальный уровень</div>
                        </div>
                        <div class="text-center p-3 rounded-lg ${analysis.is_overqualified ? 'bg-red-50' : 'bg-green-50'}">
                            <div class="text-2xl font-bold">${analysis.is_overqualified ? '&#x26A0;' : '&#x2705;'}</div>
                            <div class="text-xs text-gray-500">${analysis.is_overqualified ? 'Завышены' : 'Адекватные'}</div>
                        </div>
                        <div class="text-center p-3 rounded-lg bg-gray-50">
                            <div class="text-2xl font-bold">${analysis.parsed_skills.length}</div>
                            <div class="text-xs text-gray-500">Навыков требуется</div>
                        </div>
                    </div>
                    ${analysis.overqualification_details ? `
                        <div class="p-3 rounded-lg bg-gray-50 text-sm text-gray-600">
                            ${analysis.overqualification_details.explanation}
                        </div>
                    ` : ''}
                    <div class="mt-4">
                        <h3 class="text-sm font-medium mb-2">Навыки по уровням:</h3>
                        <div class="space-y-2">
                            ${renderSkillsByLevel(analysis.skills_by_level)}
                        </div>
                    </div>
                </div>

                ${matchHtml}

                <!-- Description -->
                <div class="bg-white rounded-xl border shadow-sm p-6">
                    <h2 class="font-semibold text-lg mb-3">Описание</h2>
                    <p class="text-gray-700 whitespace-pre-line">${job.description}</p>
                    <h3 class="font-medium mt-4 mb-2">Требования:</h3>
                    <p class="text-gray-700 whitespace-pre-line">${job.requirements_text}</p>
                </div>

                <!-- Actions -->
                <div class="flex gap-3">
                    <button onclick="addToFavorites(${job.id})" class="bg-white border px-4 py-2 rounded-lg text-sm hover:bg-gray-50">&#9734; В избранное</button>
                    <button onclick="applyToJob(${job.id})" class="bg-primary-600 text-white px-4 py-2 rounded-lg text-sm hover:bg-primary-700">Откликнуться</button>
                </div>
            `;
        } catch(e) {
            document.getElementById('job-detail').innerHTML = '<p class="text-red-500">Ошибка загрузки вакансии</p>';
        }
    }

    function renderSkillsByLevel(skills) {
        let html = '';
        if (skills.junior && skills.junior.length) {
            html += `<div class="flex flex-wrap gap-1"><span class="text-xs text-green-700 font-medium mr-1">Junior:</span>${skills.junior.map(s => `<span class="text-xs px-2 py-0.5 bg-green-100 rounded">${s}</span>`).join('')}</div>`;
        }
        if (skills.mid && skills.mid.length) {
            html += `<div class="flex flex-wrap gap-1"><span class="text-xs text-blue-700 font-medium mr-1">Mid:</span>${skills.mid.map(s => `<span class="text-xs px-2 py-0.5 bg-blue-100 rounded">${s}</span>`).join('')}</div>`;
        }
        if (skills.senior && skills.senior.length) {
            html += `<div class="flex flex-wrap gap-1"><span class="text-xs text-purple-700 font-medium mr-1">Senior:</span>${skills.senior.map(s => `<span class="text-xs px-2 py-0.5 bg-purple-100 rounded">${s}</span>`).join('')}</div>`;
        }
        return html || '<span class="text-xs text-gray-400">Нет данных</span>';
    }

    function renderMatch(match) {
        const scoreColor = match.match_score >= 70 ? 'text-green-600' : match.match_score >= 40 ? 'text-yellow-600' : 'text-red-600';
        return `
        <div class="bg-white rounded-xl border shadow-sm p-6">
            <h2 class="font-semibold text-lg mb-4">Ваш матч</h2>
            <div class="flex items-center gap-4 mb-4">
                <div class="text-center">
                    <div class="text-3xl font-bold ${scoreColor}">${match.match_score}%</div>
                    <div class="text-xs text-gray-500">Совпадение</div>
                </div>
                <div class="flex-1">${scoreBar(match.match_score)}</div>
                <div class="text-sm ${match.can_apply ? 'text-green-600' : 'text-red-600'} font-medium">
                    ${match.can_apply ? '&#x2705; Можно подавать' : '&#x274C; Рекомендуем подтянуть навыки'}
                </div>
            </div>
            <p class="text-sm text-gray-600 mb-4">${match.recommendation}</p>
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <h4 class="text-sm font-medium text-green-700 mb-1">Совпадающие навыки (${match.matching_skills.length})</h4>
                    <div class="flex flex-wrap gap-1">
                        ${match.matching_skills.map(s => `<span class="text-xs px-2 py-0.5 bg-green-100 text-green-800 rounded">${s}</span>`).join('') || '<span class="text-xs text-gray-400">нет</span>'}
                    </div>
                </div>
                <div>
                    <h4 class="text-sm font-medium text-red-700 mb-1">Недостающие навыки (${match.missing_skills.length})</h4>
                    <div class="flex flex-wrap gap-1">
                        ${match.missing_skills.map(s => `<span class="text-xs px-2 py-0.5 bg-red-100 text-red-800 rounded">${s}</span>`).join('') || '<span class="text-xs text-gray-400">нет</span>'}
                    </div>
                </div>
            </div>
            ${match.learning_path && match.learning_path.length ? `
                <div class="mt-4">
                    <h4 class="text-sm font-medium mb-2">План обучения:</h4>
                    <ul class="text-sm text-gray-600 space-y-1">
                        ${match.learning_path.map(l => `<li>&#x1F4DA; ${l}</li>`).join('')}
                    </ul>
                </div>
            ` : ''}
        </div>`;
    }

    async function addToFavorites(jobId) {
        if (!currentUser) { alert('Выберите пользователя'); return; }
        try {
            await api('/analytics/favorites/', {
                method: 'POST',
                body: { user_id: currentUser.id, job_id: jobId },
            });
            alert('Добавлено в избранное!');
        } catch(e) { alert('Ошибка: ' + JSON.stringify(e)); }
    }

    async function applyToJob(jobId) {
        if (!currentUser) { alert('Выберите пользователя'); return; }
        const letter = prompt('Сопроводительное письмо (необязательно):') || '';
        try {
            await api('/applications/', {
                method: 'POST',
                body: { job: jobId, cover_letter: letter, applicant_id: currentUser.id },
            });
            alert('Заявка отправлена!');
        } catch(e) {
            if (e.non_field_errors) alert(e.non_field_errors.join(', '));
            else alert('Ошибка при отправке заявки');
        }
    }

    function onUserChanged() { loadJob(); }
    loadJob();
</script>
{% endblock %}
