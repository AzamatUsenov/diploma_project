{% extends "base.html" %}
{% block title %}Заявки — JobPlatform{% endblock %}

{% block content %}
<h1 class="text-2xl font-bold mb-6" id="page-title">Заявки</h1>
<div id="applications-content" class="space-y-3">
    <p class="text-gray-500">Загрузка...</p>
</div>
{% endblock %}

{% block extra_js %}
<script>
    if (!isLoggedIn()) { window.location = '/login/'; }

    const profile = getProfile();
    const isHR = profile && profile.role === 'hr';

    if (isHR) {
        document.getElementById('page-title').textContent = 'Отклики на вакансии';
    } else {
        document.getElementById('page-title').textContent = 'Мои заявки';
    }

    async function loadApplications() {
        try {
            const data = await api('/applications/');
            const container = document.getElementById('applications-content');

            if (!data.results || data.results.length === 0) {
                container.innerHTML = `
                    <div class="bg-white rounded-xl border p-8 text-center">
                        <p class="text-gray-500 mb-4">${isHR ? 'Пока нет откликов на ваши вакансии' : 'Вы ещё не откликались на вакансии'}</p>
                        ${!isHR ? '<a href="/jobs/" class="bg-primary-600 text-white px-4 py-2 rounded-lg text-sm">Смотреть вакансии</a>' : ''}
                    </div>`;
                return;
            }

            container.innerHTML = data.results.map(app => {
                const statusColors = {
                    pending: 'bg-yellow-100 text-yellow-700',
                    reviewed: 'bg-blue-100 text-blue-700',
                    accepted: 'bg-green-100 text-green-700',
                    rejected: 'bg-red-100 text-red-700',
                };
                const statusLabels = {
                    pending: 'На рассмотрении',
                    reviewed: 'Просмотрено',
                    accepted: 'Принято',
                    rejected: 'Отклонено',
                };

                return `
                <div class="bg-white rounded-xl border shadow-sm p-4 fade-in">
                    <div class="flex justify-between items-start">
                        <div class="flex-1">
                            <div class="flex items-center gap-2 mb-1">
                                <a href="/jobs/${app.job}/" class="font-semibold text-gray-900 hover:text-primary-600">${app.job_title}</a>
                                <span class="text-xs px-2 py-0.5 rounded-full ${statusColors[app.status] || 'bg-gray-100'}">${statusLabels[app.status] || app.status}</span>
                            </div>
                            <div class="text-sm text-gray-500">${app.job_company}</div>
                            ${isHR ? `<div class="text-sm text-gray-600 mt-1">Кандидат: <strong>${app.applicant_username}</strong></div>` : ''}
                            <div class="text-xs text-gray-400 mt-1">${new Date(app.created_at).toLocaleDateString('ru')}</div>
                        </div>
                        ${isHR ? `
                        <div class="flex gap-2 ml-4">
                            <select onchange="updateStatus(${app.id}, this.value)" class="text-xs border rounded px-2 py-1">
                                <option value="">Изменить статус</option>
                                <option value="reviewed">Просмотрено</option>
                                <option value="accepted">Принять</option>
                                <option value="rejected">Отклонить</option>
                            </select>
                        </div>` : ''}
                    </div>
                </div>`;
            }).join('');
        } catch(e) {
            document.getElementById('applications-content').innerHTML = '<p class="text-red-500">Ошибка загрузки</p>';
        }
    }

    async function updateStatus(appId, status) {
        if (!status) return;
        try {
            await api(`/applications/${appId}/status/`, { method: 'PATCH', body: { status } });
            toast('Статус обновлён!');
            loadApplications();
        } catch(e) {
            toast('Ошибка обновления', 'error');
        }
    }

    loadApplications();
</script>
{% endblock %}
