{% extends "base.html" %}
{% block title %}Регистрация — JobPlatform{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-12">
    <div class="bg-white rounded-xl border shadow-sm p-8">
        <h1 class="text-2xl font-bold text-center mb-6">Регистрация</h1>
        <form id="register-form" onsubmit="handleRegister(event)">
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Имя пользователя</label>
                <input type="text" name="username" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                <input type="email" name="email" required class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Пароль</label>
                <input type="password" name="password" required minlength="6" class="w-full border rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-primary-500 focus:border-primary-500">
            </div>
            <div class="mb-4">
                <label class="block text-sm font-medium text-gray-700 mb-1">Роль</label>
                <div class="grid grid-cols-2 gap-3">
                    <label class="flex items-center gap-2 border rounded-lg p-3 cursor-pointer hover:bg-gray-50 has-[:checked]:border-primary-500 has-[:checked]:bg-primary-50">
                        <input type="radio" name="role" value="applicant" checked class="text-primary-600">
                        <div>
                            <div class="text-sm font-medium">Соискатель</div>
                            <div class="text-xs text-gray-500">Ищу работу</div>
                        </div>
                    </label>
                    <label class="flex items-center gap-2 border rounded-lg p-3 cursor-pointer hover:bg-gray-50 has-[:checked]:border-primary-500 has-[:checked]:bg-primary-50">
                        <input type="radio" name="role" value="hr" class="text-primary-600">
                        <div>
                            <div class="text-sm font-medium">HR</div>
                            <div class="text-xs text-gray-500">Публикую вакансии</div>
                        </div>
                    </label>
                </div>
            </div>
            <div id="level-field" class="mb-6">
                <label class="block text-sm font-medium text-gray-700 mb-1">Уровень</label>
                <select name="level" class="w-full border rounded-lg px-3 py-2 text-sm">
                    <option value="junior">Junior</option>
                    <option value="mid">Mid</option>
                    <option value="senior">Senior</option>
                </select>
            </div>
            <div id="register-error" class="hidden mb-4 text-sm text-red-600 bg-red-50 p-3 rounded-lg"></div>
            <button type="submit" class="w-full bg-primary-600 text-white py-2.5 rounded-lg font-medium hover:bg-primary-700 transition">Создать аккаунт</button>
        </form>
        <p class="text-center text-sm text-gray-500 mt-4">
            Есть аккаунт? <a href="/login/" class="text-primary-600 hover:underline">Войти</a>
        </p>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    if (isLoggedIn()) window.location = '/';

    document.querySelectorAll('input[name="role"]').forEach(r => {
        r.addEventListener('change', () => {
            document.getElementById('level-field').style.display = r.value === 'hr' ? 'none' : 'block';
        });
    });

    async function handleRegister(e) {
        e.preventDefault();
        const form = e.target;
        const errEl = document.getElementById('register-error');
        errEl.classList.add('hidden');

        const data = {
            username: form.username.value,
            email: form.email.value,
            password: form.password.value,
            role: form.role.value,
        };
        if (data.role === 'applicant') {
            data.level = form.level.value;
        }

        try {
            const result = await api('/accounts/register/', { method: 'POST', body: data });
            saveAuth(result);
            toast('Аккаунт создан!');
            window.location = '/';
        } catch (err) {
            const msg = err.username ? err.username[0] : err.detail || 'Ошибка регистрации';
            errEl.textContent = msg;
            errEl.classList.remove('hidden');
        }
    }
</script>
{% endblock %}
